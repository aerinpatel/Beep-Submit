name: Daily Job Ingestion Pipeline

on:
  schedule:
    # Run every day at 02:00 UTC (07:30 AM IST), before students check early morning postings
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max_posts_to_tag:
        description: 'Optional max posts to send to LLM tagger (leave empty for all)'
        required: false
        default: ''

# Prevent concurrent pipeline runs from racing or creating duplicate runs
concurrency:
  group: job-ingestion-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Execute Fresher Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ingestion Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NODE_ENV: production
        run: |
          pnpm pipeline:run
